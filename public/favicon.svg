      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="fade" x1="18" y1="46" x2="48" y2="18">
      <stop offset="0" stop-color="#22d3ee"/>
